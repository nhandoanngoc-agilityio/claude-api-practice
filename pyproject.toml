[project]
name = "claude-api-lab"
version = "0.1.0"
description = "Every technique from the 'Building with the Claude API' course, applied to one document-desk project."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.7.0",
    "mcp>=2.3.0",
    "pydantic>=2.14.3",
]

[project.optional-dependencies]
# Voyage embeddings, as used in the course's RAG chapter. Without it the lab
# falls back to a local hashing embedder so RAG still runs offline.
voyage = ["voyageai>=0.3"]

[project.scripts]
lab = "claude_api_lab.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
